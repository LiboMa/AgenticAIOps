[project]
name = "agentic-aiops-mvp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.18.0",
    "boto3>=1.34.0",
    "click>=8.1.0",
    "kubernetes>=28.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
    "strands-agents>=1.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests that hit real AWS / Bedrock APIs (deselect with '-m \"not slow\"')",
]
# Default: skip slow tests to prevent hangs in routine test runs.
# Run slow tests explicitly: pytest -m slow
addopts = "-m 'not slow'"
timeout_method = "thread"
