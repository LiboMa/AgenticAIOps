# Runbook: Increase Memory Limit
# Triggered by: oom-001 (OOMKilled), oom_killed pattern

id: "increase-memory-limit"
name: "Increase Memory Limit"
description: "Increase container memory limit when OOMKilled detected"

triggers:
  - pattern_id: "oom-001"
  - pattern_id: "oom_killed"

preconditions:
  - check: "resource_exists"
    resource_type: "deployment"

steps:
  - id: "get-current-limits"
    action: "get_resource_limits"
    description: "获取当前资源限制"
    params:
      resource_type: "deployment"
      resource_name: "{{ resource_name }}"
      namespace: "{{ namespace }}"
    output: "current_limits"

  - id: "calculate-new-limit"
    action: "calculate"
    description: "计算新的内存限制 (增加 50%)"
    params:
      expression: "{{ current_limits.memory }} * 1.5"
      max_value: "1024Mi"
    output: "new_memory_limit"

  - id: "patch-deployment"
    action: "patch_resource"
    description: "更新 Deployment 内存限制"
    params:
      resource_type: "deployment"
      resource_name: "{{ resource_name }}"
      namespace: "{{ namespace }}"
      patch:
        spec:
          template:
            spec:
              containers:
                - name: "{{ container_name }}"
                  resources:
                    limits:
                      memory: "{{ new_memory_limit }}"
    requires_approval: false

  - id: "wait-rollout"
    action: "wait_rollout"
    description: "等待 Rollout 完成"
    params:
      resource_type: "deployment"
      resource_name: "{{ resource_name }}"
      namespace: "{{ namespace }}"
      timeout_seconds: 300

  - id: "verify-health"
    action: "verify_health"
    description: "验证 Pod 状态正常"
    params:
      namespace: "{{ namespace }}"
      label_selector: "app={{ resource_name }}"
      timeout_seconds: 120
      expected_ready: true

rollback:
  - id: "rollback-memory"
    action: "patch_resource"
    description: "回滚内存限制"
    params:
      resource_type: "deployment"
      resource_name: "{{ resource_name }}"
      namespace: "{{ namespace }}"
      patch:
        spec:
          template:
            spec:
              containers:
                - name: "{{ container_name }}"
                  resources:
                    limits:
                      memory: "{{ current_limits.memory }}"

notifications:
  on_start: true
  on_complete: true
  on_failure: true
